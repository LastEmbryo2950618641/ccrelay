server:
  port: ${CCRELAY_PORT:${WDSAVS_AI_SKILL_PORT:18191}}

spring:
  application:
    name: ccrelay
  datasource:
    driver-class-name: org.sqlite.JDBC
    url: jdbc:sqlite:${CCRELAY_DB:${WDSAVS_AI_SKILL_DB:./runtime/ccrelay/skill.db}}
    hikari:
      maximum-pool-size: ${CCRELAY_DB_POOL_SIZE:${WDSAVS_AI_SKILL_DB_POOL_SIZE:1}}
      minimum-idle: 1
      connection-timeout: ${CCRELAY_DB_CONNECTION_TIMEOUT_MS:${WDSAVS_AI_SKILL_DB_CONNECTION_TIMEOUT_MS:30000}}
      connection-test-query: SELECT 1
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: Asia/Shanghai

wdsavs:
  ai:
    skill:
      directory: ${CCRELAY_SKILL_DIR:./skills}
    task:
      recover-on-startup: true
