<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ccrelay 协作会话</title>
  <style>
    :root {
      color-scheme: light;
      --app-bg: #f3f4f6;
      --canvas: #ffffff;
      --sidebar: #f7f7f8;
      --surface: #f4f5f6;
      --surface-strong: #ebedef;
      --line: #e2e4e7;
      --line-strong: #d3d6da;
      --text: #191b1f;
      --muted: #6d737c;
      --soft: #9399a1;
      --accent: #147d64;
      --accent-soft: #e8f5f0;
      --blue: #2563a6;
      --blue-soft: #eaf2fb;
      --danger: #b42318;
      --danger-soft: #fef0ee;
      --warning: #9a6700;
      --warning-soft: #fff6dd;
      --shadow: 0 12px 32px rgba(20, 24, 31, .08);
      --sidebar-width: 340px;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      min-width: 320px;
      overflow: hidden;
      background: var(--app-bg);
      color: var(--text);
      font: 14px/1.55 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 0;
    }
    button, input, select, textarea { font: inherit; letter-spacing: 0; }
    button, select { color: inherit; }
    button:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible {
      outline: 2px solid #6fb9a6;
      outline-offset: 2px;
    }
    button { cursor: pointer; }

    .app-shell {
      display: grid;
      grid-template-columns: minmax(0, 1fr) var(--sidebar-width);
      width: 100%;
      height: 100%;
      background: var(--canvas);
    }

    .workspace {
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr) auto;
      min-width: 0;
      min-height: 0;
      background: var(--canvas);
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      min-height: 64px;
      border-bottom: 1px solid var(--line);
      padding: 12px 22px;
    }
    .topbar-left, .topbar-actions, .mode-switch, .node-picker {
      display: flex;
      align-items: center;
    }
    .topbar-left { min-width: 0; gap: 12px; }
    .topbar-actions { flex: none; gap: 8px; }
    .prototype-badge {
      border: 1px solid #d8e4ef;
      border-radius: 5px;
      background: var(--blue-soft);
      color: var(--blue);
      padding: 4px 8px;
      font-size: 11px;
      white-space: nowrap;
    }
    .mode-switch {
      flex: none;
      gap: 2px;
      border: 1px solid var(--line-strong);
      border-radius: 7px;
      background: var(--surface);
      padding: 3px;
    }
    .mode-button {
      min-height: 32px;
      border: 0;
      border-radius: 5px;
      background: transparent;
      color: var(--muted);
      padding: 5px 11px;
    }
    .mode-button:hover { color: var(--text); }
    .mode-button.active {
      background: var(--canvas);
      color: var(--text);
      box-shadow: 0 1px 3px rgba(20, 24, 31, .12);
      font-weight: 620;
    }
    .node-picker { min-width: 0; gap: 7px; }
    .node-picker[hidden] { display: none; }
    .node-picker-label { flex: none; color: var(--muted); font-size: 12px; }
    select {
      min-width: 220px;
      max-width: min(34vw, 380px);
      height: 36px;
      overflow: hidden;
      border: 1px solid var(--line-strong);
      border-radius: 6px;
      background: var(--canvas);
      padding: 0 30px 0 10px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .icon-button, .sidebar-toggle {
      display: inline-grid;
      place-items: center;
      min-width: 36px;
      height: 36px;
      border: 1px solid var(--line-strong);
      border-radius: 6px;
      background: var(--canvas);
      padding: 0 9px;
    }
    .icon-button:hover, .sidebar-toggle:hover { background: var(--surface); }
    .sidebar-toggle { display: none; width: auto; gap: 7px; grid-auto-flow: column; }

    .conversation-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 18px;
      border-bottom: 1px solid var(--line);
      padding: 17px 28px 15px;
    }
    .conversation-title { min-width: 0; }
    .conversation-title h1 {
      margin: 0;
      overflow: hidden;
      font-size: 17px;
      font-weight: 650;
      line-height: 1.35;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .conversation-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 5px;
      color: var(--muted);
      font-size: 12px;
      flex-wrap: wrap;
    }
    .status-dot {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--accent);
    }
    .status-dot::before {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: currentColor;
      content: "";
    }
    .status-dot.failed, .status-dot.cancelled, .status-dot.timeout { color: var(--danger); }
    .status-dot.running, .status-dot.pending { color: var(--blue); }
    .head-summary { flex: none; color: var(--muted); font-size: 12px; text-align: right; }

    .conversation-scroll {
      min-width: 0;
      min-height: 0;
      overflow: auto;
      overscroll-behavior: contain;
      scrollbar-gutter: stable;
    }
    .conversation {
      width: min(100%, 920px);
      min-height: 100%;
      margin: 0 auto;
      padding: 28px 30px 72px;
    }

    .chat-composer {
      position: relative;
      z-index: 4;
      border-top: 1px solid var(--line);
      background: rgba(255, 255, 255, .98);
      padding: 10px max(22px, calc((100% - 920px) / 2 + 30px)) 12px;
    }
    .composer-inner { position: relative; max-width: 920px; margin: 0 auto; }
    .mention-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
      min-height: 27px;
      margin-bottom: 6px;
    }
    .mention-trigger {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      height: 26px;
      border: 1px solid #b9d9cf;
      border-radius: 6px;
      background: var(--accent-soft);
      color: var(--accent);
      padding: 0 9px;
      font-size: 12px;
      font-weight: 620;
    }
    .mention-trigger:hover { border-color: var(--accent); background: #def0e9; }
    .mention-chips { display: flex; flex-wrap: wrap; gap: 5px; }
    .mention-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      max-width: 220px;
      height: 26px;
      border: 1px solid #d4e4df;
      border-radius: 6px;
      background: #f7fbf9;
      color: var(--text);
      padding: 0 7px 0 8px;
      font-size: 12px;
    }
    .mention-chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .mention-chip button {
      width: 17px;
      height: 17px;
      border: 0;
      border-radius: 4px;
      background: transparent;
      color: var(--muted);
      padding: 0;
      line-height: 1;
    }
    .mention-chip button:hover { background: var(--surface-strong); color: var(--text); }
    .mention-menu {
      position: absolute;
      bottom: calc(100% - 2px);
      left: 0;
      width: min(300px, 100%);
      max-height: 250px;
      overflow: auto;
      border: 1px solid var(--line-strong);
      border-radius: 7px;
      background: var(--canvas);
      box-shadow: var(--shadow);
      padding: 5px;
    }
    .mention-menu[hidden] { display: none; }
    .mention-menu .empty-state { min-height: 40px; padding: 10px; font-size: 12px; }
    .mention-option {
      display: flex;
      align-items: center;
      width: 100%;
      gap: 8px;
      border: 0;
      border-radius: 5px;
      background: transparent;
      padding: 8px 9px;
      text-align: left;
    }
    .mention-option:hover, .mention-option.selected { background: var(--accent-soft); }
    .mention-option-status { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
    .mention-option-status.degraded { background: var(--warning); }
    .mention-option-status.offline, .mention-option-status.failed { background: var(--soft); }
    .mention-option-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .mention-option-state { margin-left: auto; color: var(--soft); font-size: 11px; }
    .composer-input {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 38px;
      align-items: end;
      gap: 8px;
      border: 1px solid var(--line-strong);
      border-radius: 8px;
      background: var(--canvas);
      padding: 6px;
      transition: border-color .16s ease, box-shadow .16s ease;
    }
    .composer-input:focus-within { border-color: #8cc8b8; box-shadow: 0 0 0 3px rgba(20, 125, 100, .09); }
    .composer-input textarea {
      width: 100%;
      min-height: 38px;
      max-height: 116px;
      resize: none;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--text);
      padding: 5px 7px;
      line-height: 1.5;
    }
    .composer-input textarea::placeholder { color: var(--soft); }
    .send-button {
      display: grid;
      place-items: center;
      width: 36px;
      height: 36px;
      border: 0;
      border-radius: 6px;
      background: var(--accent);
      color: white;
      font-size: 20px;
      line-height: 1;
    }
    .send-button:hover { background: #0e684f; }
    .send-button:disabled { cursor: not-allowed; background: var(--line-strong); color: white; }
    .composer-feedback {
      min-height: 18px;
      margin: 4px 3px 0;
      color: var(--muted);
      font-size: 11px;
    }
    .composer-feedback.error { color: var(--danger); }
    .composer-feedback.success { color: var(--accent); }
    .day-marker {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 8px 0 24px;
      color: var(--soft);
      font-size: 11px;
    }
    .day-marker::before, .day-marker::after { height: 1px; background: var(--line); content: ""; flex: 1; }

    .message {
      display: grid;
      grid-template-columns: 34px minmax(0, 1fr);
      gap: 11px;
      margin: 0 0 24px;
    }
    .avatar {
      display: grid;
      place-items: center;
      width: 34px;
      height: 34px;
      border: 1px solid #cfe5dd;
      border-radius: 7px;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
    }
    .message.tool-message .avatar { border-color: #d9e3ef; background: var(--blue-soft); color: var(--blue); font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
    .message.failure-message .avatar { border-color: #f1cbc7; background: var(--danger-soft); color: var(--danger); }
    .message-content { min-width: 0; }
    .message-head {
      display: flex;
      align-items: baseline;
      gap: 8px;
      min-width: 0;
      margin-bottom: 6px;
    }
    .sender { min-width: 0; overflow-wrap: anywhere; font-size: 13px; font-weight: 650; }
    .route {
      min-width: 0;
      overflow: hidden;
      color: var(--muted);
      font-size: 12px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .message-time { flex: none; margin-left: auto; color: var(--soft); font-size: 11px; }
    .task-reference {
      display: inline-block;
      max-width: 160px;
      overflow: hidden;
      color: var(--soft);
      font: 10px/1.3 ui-monospace, SFMono-Regular, Consolas, monospace;
      text-overflow: ellipsis;
      vertical-align: middle;
      white-space: nowrap;
    }
    .message-text {
      margin: 0;
      color: #292c31;
      font-size: 15px;
      line-height: 1.75;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .message-text.markdown-body { white-space: normal; }
    .markdown-body > :first-child { margin-top: 0; }
    .markdown-body > :last-child { margin-bottom: 0; }
    .markdown-body p { margin: 0 0 12px; }
    .markdown-body h1,
    .markdown-body h2,
    .markdown-body h3,
    .markdown-body h4,
    .markdown-body h5,
    .markdown-body h6 {
      margin: 22px 0 9px;
      color: var(--text);
      line-height: 1.35;
      font-weight: 680;
    }
    .markdown-body h1 { font-size: 22px; }
    .markdown-body h2 { border-bottom: 1px solid var(--line); padding-bottom: 6px; font-size: 19px; }
    .markdown-body h3 { font-size: 17px; }
    .markdown-body h4,
    .markdown-body h5,
    .markdown-body h6 { font-size: 15px; }
    .markdown-body ul,
    .markdown-body ol { margin: 0 0 12px; padding-left: 25px; }
    .markdown-body li { margin: 3px 0; padding-left: 2px; }
    .markdown-body blockquote {
      margin: 0 0 12px;
      border-left: 3px solid var(--line-strong);
      color: var(--muted);
      padding: 2px 0 2px 12px;
    }
    .markdown-body code {
      border-radius: 4px;
      background: #eef0f2;
      padding: 2px 5px;
      font: 13px/1.55 ui-monospace, SFMono-Regular, Consolas, monospace;
    }
    .markdown-body pre {
      max-width: 100%;
      overflow: auto;
      margin: 0 0 14px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #f6f7f8;
      padding: 12px 14px;
    }
    .markdown-body pre code { display: block; min-width: max-content; background: transparent; padding: 0; white-space: pre; }
    .markdown-body a { color: var(--blue); text-decoration-thickness: 1px; text-underline-offset: 2px; }
    .markdown-body hr { margin: 18px 0; border: 0; border-top: 1px solid var(--line); }
    .markdown-body .table-scroll { max-width: 100%; overflow-x: auto; margin: 0 0 14px; }
    .markdown-body table { width: 100%; border-collapse: collapse; font-size: 14px; }
    .markdown-body th,
    .markdown-body td { border: 1px solid var(--line); padding: 7px 9px; text-align: left; vertical-align: top; }
    .markdown-body th { background: var(--surface); font-weight: 650; }
    .message.final-message .message-text {
      border-left: 3px solid #84cbb8;
      padding-left: 14px;
    }
    .message.pending-message .message-text { color: var(--muted); font-style: italic; }
    .message.failure-message .message-text { color: var(--danger); }
    .message-badge {
      display: inline-flex;
      align-items: center;
      height: 20px;
      border-radius: 10px;
      background: var(--accent-soft);
      color: var(--accent);
      padding: 0 7px;
      font-size: 10px;
      font-weight: 650;
    }

    details.tool-panel {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #fbfbfc;
    }
    details.tool-panel summary {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto auto;
      align-items: center;
      gap: 9px;
      min-height: 42px;
      cursor: pointer;
      list-style: none;
      padding: 8px 11px;
      user-select: none;
    }
    details.tool-panel summary::-webkit-details-marker { display: none; }
    details.tool-panel summary:hover { background: var(--surface); }
    .terminal-icon { color: var(--blue); font: 12px/1 ui-monospace, SFMono-Regular, Consolas, monospace; }
    .tool-label { overflow: hidden; font: 12px/1.5 ui-monospace, SFMono-Regular, Consolas, monospace; text-overflow: ellipsis; white-space: nowrap; }
    .tool-state { color: var(--muted); font-size: 11px; }
    .tool-state.failed { color: var(--danger); }
    .chevron { color: var(--soft); transition: transform .16s ease; }
    details[open] .chevron { transform: rotate(90deg); }
    details.execution-panel {
      margin-top: 14px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #fbfbfc;
    }
    details.execution-panel > summary {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto auto;
      align-items: center;
      gap: 9px;
      min-height: 42px;
      cursor: pointer;
      list-style: none;
      padding: 8px 11px;
      user-select: none;
    }
    details.execution-panel > summary::-webkit-details-marker { display: none; }
    details.execution-panel > summary:hover { background: var(--surface); }
    .execution-summary { overflow: hidden; color: var(--muted); font-size: 12px; text-overflow: ellipsis; white-space: nowrap; }
    .execution-body { display: grid; gap: 10px; border-top: 1px solid var(--line); padding: 12px; }
    .trace-entry { display: grid; grid-template-columns: 76px minmax(0, 1fr) auto; gap: 10px; align-items: start; }
    .trace-kind { color: var(--soft); font-size: 11px; }
    .trace-text { min-width: 0; color: var(--text); font-size: 12px; line-height: 1.65; white-space: pre-wrap; overflow-wrap: anywhere; }
    .trace-time { color: var(--soft); font-size: 10px; white-space: nowrap; }
    .execution-body details.tool-panel { background: var(--canvas); }
    .tool-body {
      display: grid;
      gap: 12px;
      border-top: 1px solid var(--line);
      padding: 12px;
    }
    .tool-section { min-width: 0; }
    .tool-section-label { margin-bottom: 5px; color: var(--muted); font-size: 11px; }
    pre {
      max-height: 320px;
      margin: 0;
      overflow: auto;
      border-radius: 5px;
      background: #202328;
      color: #e6e8eb;
      padding: 11px 12px;
      font: 12px/1.55 ui-monospace, SFMono-Regular, Consolas, monospace;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .task-divider {
      display: flex;
      align-items: center;
      gap: 9px;
      margin: 2px 0 18px 45px;
      color: var(--muted);
      font-size: 11px;
    }
    .task-divider::after { height: 1px; background: var(--line); content: ""; flex: 1; }
    .task-state {
      border-radius: 9px;
      background: var(--surface-strong);
      color: var(--muted);
      padding: 1px 7px;
      font-size: 10px;
    }
    .task-state.success { background: var(--accent-soft); color: var(--accent); }
    .task-state.failed, .task-state.cancelled, .task-state.timeout { background: var(--danger-soft); color: var(--danger); }
    .task-state.running, .task-state.pending { background: var(--blue-soft); color: var(--blue); }

    .empty-state, .error-state, .loading-state {
      display: grid;
      place-items: center;
      min-height: 360px;
      color: var(--muted);
      text-align: center;
    }
    .empty-state strong, .error-state strong { display: block; margin-bottom: 4px; color: var(--text); font-size: 14px; }
    .error-state { color: var(--danger); }
    .loading-dots { display: inline-flex; gap: 5px; margin-bottom: 10px; }
    .loading-dots span { width: 6px; height: 6px; border-radius: 50%; background: var(--blue); animation: pulse 1.1s ease-in-out infinite; }
    .loading-dots span:nth-child(2) { animation-delay: .14s; }
    .loading-dots span:nth-child(3) { animation-delay: .28s; }
    @keyframes pulse { 50% { opacity: .25; transform: translateY(-2px); } }

    .session-sidebar {
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr) auto auto;
      min-width: 0;
      min-height: 0;
      border-left: 1px solid var(--line);
      background: var(--sidebar);
    }
    .sidebar-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 64px;
      border-bottom: 1px solid var(--line);
      padding: 13px 16px;
    }
    .sidebar-head-actions { display: flex; align-items: center; gap: 6px; }
    .sidebar-title { font-size: 15px; font-weight: 650; }
    .session-count { margin-left: 6px; color: var(--muted); font-size: 12px; font-weight: 450; }
    .sidebar-search { padding: 12px 14px 9px; }
    .sidebar-search input {
      width: 100%;
      height: 36px;
      border: 1px solid var(--line-strong);
      border-radius: 6px;
      background: var(--canvas);
      color: var(--text);
      padding: 0 10px;
    }
    .sidebar-search input::placeholder { color: var(--soft); }
    .session-list { min-height: 0; overflow: auto; padding: 4px 8px 12px; }
    .new-session-area {
      display: grid;
      place-items: center;
      min-height: 86px;
      border-top: 1px solid var(--line);
      background: var(--sidebar);
    }
    .new-session-button {
      display: grid;
      place-items: center;
      width: 38px;
      height: 38px;
      border: 1px solid var(--line-strong);
      border-radius: 7px;
      background: var(--canvas);
      color: var(--muted);
      font-size: 23px;
      line-height: 1;
    }
    .new-session-button:hover { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
    .session-item {
      display: block;
      width: 100%;
      min-height: 80px;
      border: 0;
      border-radius: 7px;
      background: transparent;
      color: var(--text);
      padding: 11px 10px;
      text-align: left;
    }
    .session-item:hover { background: #eceef0; }
    .session-item.active { background: var(--canvas); box-shadow: 0 1px 4px rgba(20, 24, 31, .1); }
    .session-item-head { display: flex; align-items: center; gap: 7px; }
    .session-name { min-width: 0; overflow: hidden; font-size: 13px; font-weight: 620; text-overflow: ellipsis; white-space: nowrap; }
    .session-time { flex: none; margin-left: auto; color: var(--soft); font-size: 10px; }
    .session-preview {
      display: -webkit-box;
      min-height: 36px;
      margin-top: 5px;
      overflow: hidden;
      color: var(--muted);
      font-size: 12px;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
    }
    .session-stats { display: flex; align-items: center; gap: 8px; margin-top: 6px; color: var(--soft); font-size: 10px; }
    .session-status { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
    .session-status.closed, .session-status.failed { background: var(--soft); }
    .sidebar-foot { border-top: 1px solid var(--line); color: var(--muted); padding: 11px 16px; font-size: 11px; }
    .sidebar-overlay { display: none; }

    @media (max-width: 980px) {
      :root { --sidebar-width: 310px; }
      .topbar { align-items: flex-start; }
      .topbar-left { align-items: flex-start; flex-direction: column; }
      .node-picker { width: 100%; }
      select { min-width: 200px; max-width: 44vw; }
    }

    @media (max-width: 760px) {
      .app-shell { display: block; position: relative; }
      .workspace { height: 100%; }
      .topbar { min-height: 0; padding: 10px 12px; }
      .topbar-left { gap: 8px; }
      .mode-switch { width: 100%; }
      .mode-button { flex: 1; }
      .node-picker { display: grid; grid-template-columns: auto minmax(0, 1fr); }
      select { width: 100%; min-width: 0; max-width: none; }
      .sidebar-toggle { display: inline-grid; }
      .conversation-head { padding: 14px 16px 12px; }
      .head-summary { display: none; }
      .conversation { padding: 22px 15px 56px; }
      .chat-composer { padding: 9px 12px 10px; }
      .message { grid-template-columns: 30px minmax(0, 1fr); gap: 9px; margin-bottom: 20px; }
      .avatar { width: 30px; height: 30px; }
      .message-head { align-items: flex-start; flex-wrap: wrap; gap: 4px 7px; }
      .route { max-width: calc(100% - 82px); }
      .message-time { margin-left: 0; }
      .task-reference { max-width: 120px; }
      .task-divider { margin-left: 39px; }
      details.tool-panel summary { grid-template-columns: auto minmax(0, 1fr) auto; }
      .tool-state { display: none; }
      .session-sidebar {
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        left: auto;
        z-index: 30;
        width: min(88vw, 360px);
        border-left: 1px solid var(--line-strong);
        box-shadow: var(--shadow);
        transform: translateX(105%);
        transition: transform .2s ease;
      }
      body.sidebar-open .session-sidebar { transform: translateX(0); }
      .sidebar-overlay {
        position: absolute;
        inset: 0;
        z-index: 20;
        display: block;
        visibility: hidden;
        border: 0;
        background: rgba(20, 24, 31, .25);
        opacity: 0;
        transition: opacity .2s ease, visibility .2s ease;
      }
      body.sidebar-open .sidebar-overlay { visibility: visible; opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <main class="workspace">
      <header class="topbar">
        <div class="topbar-left">
          <div class="mode-switch" role="group" aria-label="查看模式">
            <button id="nodeModeButton" class="mode-button active" type="button" data-mode="NODE">节点模式</button>
            <button id="groupModeButton" class="mode-button" type="button" data-mode="GROUP">会话群聊</button>
          </div>
          <label id="nodePicker" class="node-picker">
            <span class="node-picker-label">节点</span>
            <select id="nodeSelect" aria-label="选择节点"><option>先选择会话</option></select>
          </label>
        </div>
        <div class="topbar-actions">
          <span class="prototype-badge">实时 · CC center</span>
          <button id="refreshButton" class="icon-button" type="button" title="刷新当前会话" aria-label="刷新当前会话">↻</button>
          <button id="sidebarToggle" class="sidebar-toggle" type="button" aria-label="打开会话列表"><span>会话</span><span>☰</span></button>
        </div>
      </header>

      <section class="conversation-head" aria-live="polite">
        <div class="conversation-title">
          <h1 id="conversationTitle">选择一个会话</h1>
          <div id="conversationMeta" class="conversation-meta"></div>
        </div>
        <div id="headSummary" class="head-summary">--</div>
      </section>

      <div id="conversationScroll" class="conversation-scroll">
        <section id="conversation" class="conversation" aria-live="polite">
          <div class="empty-state"><div><strong>尚未选择会话</strong>从右侧会话列表开始查看 Agent 协作过程</div></div>
        </section>
      </div>
      <footer class="chat-composer" aria-label="会话消息输入">
        <div class="composer-inner">
          <div id="mentionMenu" class="mention-menu" role="listbox" aria-label="选择要回复的节点" hidden></div>
          <div class="mention-row">
            <button id="mentionButton" class="mention-trigger" type="button" title="选择要回复的节点" aria-haspopup="listbox" aria-expanded="false">@ <span>选择节点</span></button>
            <div id="mentionChips" class="mention-chips" aria-live="polite"></div>
          </div>
          <div class="composer-input">
            <textarea id="messageInput" rows="1" placeholder="输入消息" aria-label="输入会话消息"></textarea>
            <button id="sendMessageButton" class="send-button" type="button" title="发送消息" aria-label="发送消息">↑</button>
          </div>
          <div id="composerFeedback" class="composer-feedback" role="status" aria-live="polite"></div>
        </div>
      </footer>
    </main>

    <aside class="session-sidebar" aria-label="会话列表">
      <div class="sidebar-head">
        <div class="sidebar-title">会话<span id="sessionCount" class="session-count">0</span></div>
        <div class="sidebar-head-actions">
          <button id="closeSidebar" class="icon-button" type="button" title="关闭会话列表" aria-label="关闭会话列表">×</button>
        </div>
      </div>
      <div class="sidebar-search">
        <input id="sessionSearch" type="search" placeholder="搜索会话或节点" aria-label="搜索会话或节点">
      </div>
      <nav id="sessionList" class="session-list" aria-label="可用会话"></nav>
      <div class="new-session-area">
        <button id="newSessionButton" class="new-session-button" type="button" title="新建会话" aria-label="新建会话">+</button>
      </div>
      <div id="sidebarFoot" class="sidebar-foot">正在连接 CC center...</div>
    </aside>
    <button id="sidebarOverlay" class="sidebar-overlay" type="button" aria-label="关闭会话列表"></button>
  </div>

  <script>
    const EXPANDED_PANELS_STORAGE_KEY = "ccrelay-observer.expanded-panels.v1";

    function loadExpandedPanels() {
      try {
        const stored = JSON.parse(sessionStorage.getItem(EXPANDED_PANELS_STORAGE_KEY) || "[]");
        return new Set(Array.isArray(stored) ? stored.filter((value) => typeof value === "string") : []);
      } catch (_) {
        return new Set();
      }
    }

    const state = {
      mode: "NODE",
      nodes: [],
      sessions: [],
      selectedSessionId: "",
      selectedNodeId: "",
      search: "",
      requestSerial: 0,
      lastUpdated: null,
      mentions: [],
      createdSessions: [],
      localMessages: {},
      contextMessages: {},
      currentObservations: [],
      currentFailures: [],
      expandedPanels: loadExpandedPanels()
    };
    let refreshInFlight = false;
    const $ = (id) => document.getElementById(id);

    const API_BASE = "/api/skill";
    const uiApi = async (path, options = {}) => {
      const response = await fetch(`${API_BASE}${path}`, {
        headers: { "Content-Type": "application/json", ...(options.headers || {}) },
        ...options
      });
      const body = await response.text();
      let parsed;
      try { parsed = body ? JSON.parse(body) : {}; } catch (_) { parsed = { message: body }; }
      if (!response.ok) throw new Error(parsed.message || `HTTP ${response.status}`);
      return parsed;
    };

    function text(value, fallback = "--") {
      return value === null || value === undefined || value === "" ? fallback : String(value);
    }

    function addText(parent, tag, value, className) {
      const element = document.createElement(tag);
      if (className) element.className = className;
      element.textContent = text(value, "");
      parent.appendChild(element);
      return element;
    }

    function appendInlineMarkdown(parent, value) {
      const source = text(value, "");
      const pattern = /(`[^`\n]+`|\*\*[^*\n]+\*\*|__[^_\n]+__|~~[^~\n]+~~|\[[^\]\n]+\]\(https?:\/\/[^\s)]+\)|\*[^*\n]+\*|_[^_\n]+_)/g;
      let cursor = 0;
      let match;
      while ((match = pattern.exec(source)) !== null) {
        if (match.index > cursor) parent.appendChild(document.createTextNode(source.slice(cursor, match.index)));
        const token = match[0];
        let element;
        if (token.startsWith("`")) {
          element = document.createElement("code");
          element.textContent = token.slice(1, -1);
        } else if (token.startsWith("**") || token.startsWith("__")) {
          element = document.createElement("strong");
          element.textContent = token.slice(2, -2);
        } else if (token.startsWith("~~")) {
          element = document.createElement("del");
          element.textContent = token.slice(2, -2);
        } else if (token.startsWith("[")) {
          const closing = token.indexOf("](");
          element = document.createElement("a");
          element.textContent = token.slice(1, closing);
          element.href = token.slice(closing + 2, -1);
          element.target = "_blank";
          element.rel = "noopener noreferrer";
        } else {
          element = document.createElement("em");
          element.textContent = token.slice(1, -1);
        }
        parent.appendChild(element);
        cursor = pattern.lastIndex;
      }
      if (cursor < source.length) parent.appendChild(document.createTextNode(source.slice(cursor)));
    }

    function tableCells(line) {
      const trimmed = line.trim().replace(/^\|/, "").replace(/\|$/, "");
      return trimmed.split("|").map((cell) => cell.trim());
    }

    function isTableDivider(line) {
      const cells = tableCells(line);
      return cells.length > 0 && cells.every((cell) => /^:?-{3,}:?$/.test(cell));
    }

    function addMarkdown(parent, value, className) {
      const root = document.createElement("div");
      root.className = `${className || ""} markdown-body`.trim();
      const lines = text(value, "").replace(/\r\n?/g, "\n").split("\n");
      let index = 0;
      let list = null;

      const closeList = () => { list = null; };
      const appendBlock = (tag, content) => {
        closeList();
        const block = document.createElement(tag);
        appendInlineMarkdown(block, content);
        root.appendChild(block);
      };

      while (index < lines.length) {
        const line = lines[index];
        if (!line.trim()) {
          closeList();
          index += 1;
          continue;
        }

        const fence = line.match(/^\s*```\s*([^\s`]*)\s*$/);
        if (fence) {
          closeList();
          const codeLines = [];
          index += 1;
          while (index < lines.length && !/^\s*```\s*$/.test(lines[index])) {
            codeLines.push(lines[index]);
            index += 1;
          }
          if (index < lines.length) index += 1;
          const pre = document.createElement("pre");
          const code = document.createElement("code");
          if (fence[1]) code.dataset.language = fence[1];
          code.textContent = codeLines.join("\n");
          pre.appendChild(code);
          root.appendChild(pre);
          continue;
        }

        const heading = line.match(/^\s*(#{1,6})\s+(.+?)\s*#*\s*$/);
        if (heading) {
          appendBlock(`h${heading[1].length}`, heading[2]);
          index += 1;
          continue;
        }

        if (/^\s*(?:-{3,}|\*{3,}|_{3,})\s*$/.test(line)) {
          closeList();
          root.appendChild(document.createElement("hr"));
          index += 1;
          continue;
        }

        if (index + 1 < lines.length && line.includes("|") && isTableDivider(lines[index + 1])) {
          closeList();
          const wrapper = document.createElement("div");
          wrapper.className = "table-scroll";
          const table = document.createElement("table");
          const head = document.createElement("thead");
          const headRow = document.createElement("tr");
          tableCells(line).forEach((cell) => {
            const th = document.createElement("th");
            appendInlineMarkdown(th, cell);
            headRow.appendChild(th);
          });
          head.appendChild(headRow);
          table.appendChild(head);
          const body = document.createElement("tbody");
          index += 2;
          while (index < lines.length && lines[index].includes("|") && lines[index].trim()) {
            const row = document.createElement("tr");
            tableCells(lines[index]).forEach((cell) => {
              const td = document.createElement("td");
              appendInlineMarkdown(td, cell);
              row.appendChild(td);
            });
            body.appendChild(row);
            index += 1;
          }
          table.appendChild(body);
          wrapper.appendChild(table);
          root.appendChild(wrapper);
          continue;
        }

        const unordered = line.match(/^\s*[-+*]\s+(.+)$/);
        const ordered = line.match(/^\s*\d+[.)]\s+(.+)$/);
        if (unordered || ordered) {
          const tag = ordered ? "ol" : "ul";
          if (!list || list.tagName.toLowerCase() !== tag) {
            list = document.createElement(tag);
            root.appendChild(list);
          }
          const item = document.createElement("li");
          appendInlineMarkdown(item, (ordered || unordered)[1]);
          list.appendChild(item);
          index += 1;
          continue;
        }

        const quote = line.match(/^\s*>\s?(.*)$/);
        if (quote) {
          appendBlock("blockquote", quote[1]);
          index += 1;
          continue;
        }

        closeList();
        const paragraphLines = [line.trim()];
        index += 1;
        while (index < lines.length && lines[index].trim()
          && !/^\s*(?:#{1,6}\s+|```|[-+*]\s+|\d+[.)]\s+|>\s?)/.test(lines[index])
          && !(index + 1 < lines.length && lines[index].includes("|") && isTableDivider(lines[index + 1]))) {
          paragraphLines.push(lines[index].trim());
          index += 1;
        }
        appendBlock("p", paragraphLines.join(" "));
      }

      parent.appendChild(root);
      return root;
    }

    function expandedPanelKey(kind, item, suffix = "") {
      const identity = item?.taskId || item?.key || item?.eventId
        || `${item?.sequenceNo || 0}:${item?.time || 0}`;
      return [state.selectedSessionId, state.mode, state.selectedNodeId || "*", kind, identity, suffix]
        .map((value) => String(value || ""))
        .join("|");
    }

    function persistExpandedPanels() {
      try {
        const values = [...state.expandedPanels].slice(-500);
        sessionStorage.setItem(EXPANDED_PANELS_STORAGE_KEY, JSON.stringify(values));
      } catch (_) {
      }
    }

    function bindExpandedPanel(details, key) {
      details.dataset.panelKey = key;
      details.open = state.expandedPanels.has(key);
      details.addEventListener("toggle", () => {
        if (details.open) state.expandedPanels.add(key);
        else state.expandedPanels.delete(key);
        persistExpandedPanels();
      });
    }

    function json(value) {
      try { return JSON.stringify(value ?? {}, null, 2); } catch (_) { return String(value); }
    }

    function timeValue(value) {
      const number = Number(value);
      if (Number.isFinite(number) && number > 0) return number;
      const parsed = Date.parse(value || "");
      return Number.isFinite(parsed) ? parsed : 0;
    }

    function formatTime(value, includeDate = false) {
      const millis = timeValue(value);
      if (!millis) return "--";
      const date = new Date(millis);
      return includeDate
        ? date.toLocaleString([], { month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit" })
        : date.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    }

    function formatDate(value) {
      const millis = timeValue(value);
      if (!millis) return "时间未知";
      return new Date(millis).toLocaleDateString([], { year: "numeric", month: "long", day: "numeric" });
    }

    function formatDuration(value) {
      const millis = Number(value);
      if (!Number.isFinite(millis) || millis < 0) return "";
      if (millis < 1000) return `${Math.round(millis)}ms`;
      if (millis < 60000) return `${(millis / 1000).toFixed(millis < 10000 ? 1 : 0)}s`;
      return `${Math.floor(millis / 60000)}m ${Math.round((millis % 60000) / 1000)}s`;
    }

    function shortId(value, length = 10) {
      const content = text(value, "");
      return content.length > length ? content.slice(0, length) : content;
    }

    function nodeLabel(nodeId) {
      return text(nodeId, "协调者");
    }

    function avatarLabel(nodeId) {
      const node = nodeLabel(nodeId);
      const port = node.match(/:(\d+)$/)?.[1];
      if (port) return port.slice(-2);
      const value = node.replace(/[^a-zA-Z0-9\u4e00-\u9fa5]/g, "");
      return value.slice(0, 2) || "AI";
    }

    function payload(event) {
      return event?.payload && typeof event.payload === "object" ? event.payload : {};
    }

    function selectedSession() {
      return state.sessions.find((session) => session.sessionId === state.selectedSessionId) || null;
    }

    function registeredNode(nodeId) {
      return state.nodes.find((node) => node.nodeId === nodeId) || null;
    }

    function sessionNodes() {
      return state.nodes.map((node) => node.nodeId).filter(Boolean);
    }

    function renderMentionChips() {
      const root = $("mentionChips");
      root.replaceChildren();
      state.mentions.forEach((nodeId) => {
        const chip = document.createElement("span");
        chip.className = "mention-chip";
        addText(chip, "span", `@ ${nodeLabel(nodeId)}`);
        const remove = document.createElement("button");
        remove.type = "button";
        remove.dataset.removeMention = nodeId;
        remove.title = `移除 ${nodeLabel(nodeId)}`;
        remove.setAttribute("aria-label", `移除 ${nodeLabel(nodeId)}`);
        remove.textContent = "×";
        chip.appendChild(remove);
        root.appendChild(chip);
      });
    }

    function setMentionMenuOpen(open, filter = "") {
      const menu = $("mentionMenu");
      if (!open) {
        menu.hidden = true;
        $("mentionButton").setAttribute("aria-expanded", "false");
        return;
      }
      const normalizedFilter = String(filter || "").toLowerCase();
      menu.replaceChildren();
      const available = sessionNodes().filter((nodeId) =>
        !normalizedFilter || String(nodeId).toLowerCase().includes(normalizedFilter));
      if (!available.length) {
        addText(menu, "div", "当前会话没有匹配的节点", "empty-state");
      } else {
        available.forEach((nodeId) => {
          const node = registeredNode(nodeId);
          const option = document.createElement("button");
          option.type = "button";
          option.className = `mention-option${state.mentions.includes(nodeId) ? " selected" : ""}`;
          option.dataset.mentionNode = nodeId;
          option.setAttribute("role", "option");
          option.setAttribute("aria-selected", state.mentions.includes(nodeId) ? "true" : "false");
          const status = document.createElement("span");
          status.className = `mention-option-status ${String(node?.status || "").toLowerCase()}`;
          option.appendChild(status);
          addText(option, "span", nodeId, "mention-option-name");
          addText(option, "span", node?.status || "未注册", "mention-option-state");
          menu.appendChild(option);
        });
      }
      menu.hidden = false;
      $("mentionButton").setAttribute("aria-expanded", "true");
    }

    function renderComposer() {
      const validNodes = new Set(sessionNodes());
      state.mentions = state.mentions.filter((nodeId) => validNodes.has(nodeId));
      renderMentionChips();
      $("sendMessageButton").disabled = !selectedSession();
    }

    function setComposerFeedback(message, type = "") {
      const feedback = $("composerFeedback");
      feedback.textContent = message || "";
      feedback.className = `composer-feedback${type ? ` ${type}` : ""}`;
    }

    function resizeMessageInput() {
      const input = $("messageInput");
      input.style.height = "auto";
      input.style.height = `${Math.min(input.scrollHeight, 116)}px`;
    }

    function toggleMention(nodeId) {
      if (state.mentions.includes(nodeId)) {
        state.mentions = state.mentions.filter((item) => item !== nodeId);
      } else {
        state.mentions = [...state.mentions, nodeId];
      }
      renderComposer();
      setMentionMenuOpen(true);
    }

    function removeMention(nodeId) {
      state.mentions = state.mentions.filter((item) => item !== nodeId);
      renderComposer();
    }

    function mentionInputFilter() {
      const match = $("messageInput").value.match(/(?:^|\s)@([^\s@]*)$/);
      return match ? match[1] : null;
    }

    async function sendMessage() {
      const session = selectedSession();
      const content = $("messageInput").value.trim();
      if (!session) {
        setComposerFeedback("请先选择一个会话", "error");
        return;
      }
      if (!state.mentions.length) {
        setComposerFeedback("请至少 @ 一个节点后再发送", "error");
        $("mentionButton").focus();
        return;
      }
      if (!content) {
        setComposerFeedback("请输入消息内容", "error");
        $("messageInput").focus();
        return;
      }
      const targetNodeIds = [...state.mentions];
      $("sendMessageButton").disabled = true;
      setComposerFeedback(`正在向 ${targetNodeIds.length} 个 Relay 创建异步任务...`);
      try {
        const response = await uiApi(`/ui/sessions/${encodeURIComponent(session.sessionId)}/messages`, {
          method: "POST",
          body: JSON.stringify({ content, targetNodeIds, sourceNodeId: "cc-center-ui" })
        });
        const failed = (response.submissions || []).filter((item) => item.status !== "ACCEPTED");
        state.mentions = [];
        $("messageInput").value = "";
        resizeMessageInput();
        setMentionMenuOpen(false);
        await refresh({ preserveSelection: true });
        if (failed.length) {
          setComposerFeedback(`已接受 ${response.acceptedCount || 0} 个任务；${failed.map((item) => `${item.targetNodeId}: ${item.message}`).join("；")}`, "error");
        } else {
          setComposerFeedback(`已向 ${response.acceptedCount || 0} 个 Relay 创建真实异步任务，执行过程将自动刷新`, "success");
        }
        requestAnimationFrame(() => { $("conversationScroll").scrollTop = $("conversationScroll").scrollHeight; });
      } catch (error) {
        setComposerFeedback(`发送失败：${error.message}`, "error");
      } finally {
        renderComposer();
      }
    }

    function sessionTitle(session) {
      if (!session) return "选择一个会话";
      if (session.title) return session.title;
      const participants = session.nodeIds || [];
      if (participants.length === 1) return nodeLabel(participants[0]);
      if (participants.length > 1) return `${nodeLabel(participants[0])} 等 ${participants.length} 个节点`;
      return `会话 ${shortId(session.sessionId, 8)}`;
    }

    function sessionPreview(session) {
      if (session?.preview) return session.preview;
      const nodes = session.nodeIds || [];
      if (!nodes.length) return `${session.initiatorId || "协调者"} 创建的空会话`;
      if (nodes.length === 1) return `与 ${nodeLabel(nodes[0])} 的远端 Agent 协作`;
      return nodes.map(nodeLabel).join("、");
    }

    function normalizeSession(session) {
      const value = { ...session };
      value.nodeIds = Array.isArray(value.nodeIds) ? value.nodeIds : [];
      value.taskCount = Number(value.taskCount || 0);
      value.title = value.title || (value.nodeIds.length ? sessionTitle(value) : `会话 ${shortId(value.sessionId, 8)}`);
      value.preview = value.preview || sessionPreview(value);
      value.updateTime = value.updateTime || value.createTime;
      return value;
    }

    function renderMode() {
      $("nodeModeButton").classList.toggle("active", state.mode === "NODE");
      $("groupModeButton").classList.toggle("active", state.mode === "GROUP");
      $("nodePicker").hidden = state.mode !== "NODE";
    }

    function renderSessions() {
      const list = $("sessionList");
      list.replaceChildren();
      const query = state.search.trim().toLowerCase();
      const filtered = state.sessions.filter((session) => {
        if (!query) return true;
        return [session.sessionId, session.initiatorId, ...(session.nodeIds || [])]
          .some((value) => String(value || "").toLowerCase().includes(query));
      });
      $("sessionCount").textContent = String(filtered.length);
      if (!filtered.length) {
        addText(list, "div", query ? "没有匹配的会话" : "暂无会话", "empty-state");
        return;
      }
      filtered.forEach((session) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = `session-item${session.sessionId === state.selectedSessionId ? " active" : ""}`;
        button.dataset.sessionId = session.sessionId || "";
        button.setAttribute("aria-pressed", session.sessionId === state.selectedSessionId ? "true" : "false");
        const head = document.createElement("div");
        head.className = "session-item-head";
        addText(head, "span", sessionTitle(session), "session-name");
        addText(head, "span", formatTime(session.updateTime, true), "session-time");
        button.appendChild(head);
        addText(button, "div", sessionPreview(session), "session-preview");
        const stats = document.createElement("div");
        stats.className = "session-stats";
        const status = document.createElement("span");
        status.className = `session-status ${String(session.status || "").toLowerCase()}`;
        stats.appendChild(status);
        addText(stats, "span", `${session.taskCount || 0} 个任务`);
        addText(stats, "span", `${(session.nodeIds || []).length} 个节点`);
        addText(stats, "span", shortId(session.sessionId, 8));
        button.appendChild(stats);
        list.appendChild(button);
      });
    }

    function renderNodes() {
      const select = $("nodeSelect");
      select.replaceChildren();
      const session = selectedSession();
      const nodeIds = session?.nodeIds || [];
      if (!nodeIds.length) {
        addText(select, "option", "该会话没有节点");
        state.selectedNodeId = "";
        select.disabled = true;
        return;
      }
      select.disabled = false;
      nodeIds.forEach((nodeId) => {
        const node = registeredNode(nodeId);
        const option = document.createElement("option");
        option.value = nodeId;
        option.textContent = `${nodeId} · ${node?.status || "未注册"}`;
        select.appendChild(option);
      });
      if (!nodeIds.includes(state.selectedNodeId)) state.selectedNodeId = nodeIds[0];
      select.value = state.selectedNodeId;
    }

    function renderHeader() {
      const session = selectedSession();
      $("conversationTitle").textContent = sessionTitle(session);
      const meta = $("conversationMeta");
      meta.replaceChildren();
      if (!session) {
        $("headSummary").textContent = "--";
        return;
      }
      const status = addText(meta, "span", session.status || "UNKNOWN", `status-dot ${String(session.status || "").toLowerCase()}`);
      status.title = "会话状态";
      addText(meta, "span", state.mode === "NODE" ? "节点模式" : "会话群聊");
      addText(meta, "span", `${(session.nodeIds || []).length} 个参与节点`);
      if (state.mode === "NODE" && state.selectedNodeId) addText(meta, "span", nodeLabel(state.selectedNodeId));
      $("headSummary").textContent = state.lastUpdated ? `更新于 ${formatTime(state.lastUpdated)}` : `${session.taskCount || 0} 个任务`;
    }

    function taskAnswer(observation) {
      const task = observation?.task || {};
      if (task.answer) return task.answer;
      if (task.result?.answer) return task.result.answer;
      const terminal = [...(observation?.events || [])].reverse().find((event) => payload(event).answer);
      return terminal ? payload(terminal).answer : "";
    }

    function toolInputLabel(input, toolName) {
      if (input?.command) return String(input.command);
      if (input?.path) return String(input.path);
      if (input?.query) return String(input.query);
      return toolName || "工具调用";
    }

    function timelineItems(observation, session) {
      const items = [];
      const activeTools = new Map();
      const task = observation?.task || {};
      const senderNodeId = observation?.targetNodeId || task.targetNodeId || "远端 Agent";
      const receiverNodeId = task.sourceNodeId || session?.sourceNodeId || session?.initiatorId || "协调者";
      const base = {
        taskId: observation?.taskId || task.taskId || "",
        taskStatus: observation?.status || task.status || "UNKNOWN",
        taskStage: observation?.currentStage || task.currentStage || "",
        senderNodeId,
        receiverNodeId,
        observationSource: observation?.observationSource || ""
      };
      const events = [...(observation?.events || [])].sort((left, right) => {
        const sequence = Number(left.sequenceNo || 0) - Number(right.sequenceNo || 0);
        return sequence || timeValue(left.createdTime) - timeValue(right.createdTime);
      });
      events.forEach((event) => {
        const type = String(event.eventType || "").toUpperCase();
        const data = payload(event);
        const eventBase = {
          ...base,
          time: timeValue(event.createdTime),
          sequenceNo: Number(event.sequenceNo || 0),
          stepNo: Number(data.stepNo || data.action?.stepNo || 0)
        };
        if (type === "AGENT_MESSAGE" && data.text) {
          items.push({ ...eventBase, kind: "analysis", text: String(data.text) });
          return;
        }
        if (type === "AGENT_TOOL_STARTED" || type === "COMMAND_STARTED") {
          const key = String(data.toolUseId || data.stepNo || `${type}:${event.sequenceNo}`);
          const tool = {
            ...eventBase,
            kind: "tool",
            key,
            name: String(data.toolName || data.command || "命令"),
            label: toolInputLabel(data.input || data, data.toolName),
            input: data.input || { command: data.command, args: data.args || [] },
            output: "",
            status: "RUNNING",
            durationMs: null
          };
          activeTools.set(key, tool);
          items.push(tool);
          return;
        }
        if (type === "AGENT_TOOL_FINISHED" || type === "COMMAND_FINISHED") {
          const key = String(data.toolUseId || data.stepNo || "");
          let tool = activeTools.get(key);
          if (!tool) {
            tool = { ...eventBase, kind: "tool", key, name: "命令", label: "命令", input: {} };
            items.push(tool);
          }
          tool.output = data.output || data.stdout || data.stderr || data.errorMessage || "";
          tool.status = data.status || (Number(data.exitCode || 0) === 0 ? "SUCCESS" : "FAILED");
          tool.durationMs = data.durationMs;
          activeTools.delete(key);
          return;
        }
        if (type === "CONTROL_INJECTION_CONSUMED") {
          const prompts = (data.injectedPrompts || []).map((item) => item.prompt).filter(Boolean);
          if (prompts.length) items.push({ ...eventBase, kind: "analysis", text: `收到新的执行引导：${prompts.join("\n")}` });
          return;
        }
        if (["STEP_STARTED", "ACTION_PROPOSED", "ACTION_APPROVED", "OBSERVATION_RECORDED",
          "MODEL_REQUESTED", "MODEL_RESPONDED", "CONTROL_ADJUSTMENT_CONSUMED", "TASK_STOP_REQUESTED"]
          .includes(type)) {
          items.push({ ...eventBase, kind: "analysis", text: traceEventText(type, data) });
          return;
        }
        if (type === "TASK_FAILED" || type === "ACTION_REJECTED" || type === "TASK_TIMEOUT") {
          items.push({ ...eventBase, kind: "analysis", text: String(data.errorMessage || data.answer || data.errorCode || type) });
        }
      });
      if (!items.length) {
        items.push({ ...base, kind: "empty-task", time: timeValue(task.startTime), sequenceNo: 0 });
      }
      return items;
    }

    function traceEventText(type, data) {
      const step = data.stepNo ? `第 ${data.stepNo} 步` : "当前步骤";
      switch (type) {
        case "STEP_STARTED": return `开始${step}${data.maxSteps ? `（最多 ${data.maxSteps} 步）` : ""}`;
        case "ACTION_PROPOSED": return `Agent 提议执行动作：${data.action?.type || data.type || "未知动作"}`;
        case "ACTION_APPROVED": return `动作已通过授权检查：${data.type || "未知动作"}`;
        case "OBSERVATION_RECORDED": return `已记录执行观察：${summarizeTraceValue(data.observation)}`;
        case "MODEL_REQUESTED": return "正在请求模型生成下一步分析";
        case "MODEL_RESPONDED": return `模型已返回${data.status ? `（${data.status}）` : ""}`;
        case "CONTROL_ADJUSTMENT_CONSUMED": return "已应用运行中策略调整";
        case "TASK_STOP_REQUESTED": return "已收到停止请求，将在安全检查点停止";
        default: return type;
      }
    }

    function summarizeTraceValue(value) {
      if (value === null || value === undefined || value === "") return "无摘要";
      const content = typeof value === "string" ? value : json(value);
      return content.length > 240 ? `${content.slice(0, 240)}…` : content;
    }

    function sanitizeTraceValue(value, key = "") {
      if (/api.?key|token|password|passwd|secret|private.?key|authorization/i.test(key)) return "[已脱敏]";
      if (Array.isArray(value)) return value.map((item) => sanitizeTraceValue(item));
      if (value && typeof value === "object") {
        return Object.fromEntries(Object.entries(value).map(([name, item]) => [name, sanitizeTraceValue(item, name)]));
      }
      if (typeof value === "string" && value.length > 12000) return `${value.slice(0, 12000)}…[已截断]`;
      return value;
    }

    function taskTrace(observation, session, contextAnswer = "") {
      const task = observation?.task || {};
      const taskId = observation?.taskId || task.taskId || "";
      const canonicalAnswer = contextAnswer || taskAnswer(observation);
      const items = timelineItems(observation, session)
        .filter((item) => item.kind !== "empty-task")
        .filter((item) => !canonicalAnswer || item.kind !== "analysis" || item.text.trim() !== canonicalAnswer.trim());
      const itemTimes = items.map((item) => Number(item.time || 0)).filter((value) => value > 0);
      return {
        taskId,
        taskStatus: observation?.status || task.status || "UNKNOWN",
        taskStage: observation?.currentStage || task.currentStage || "",
        senderNodeId: observation?.targetNodeId || task.targetNodeId || "远端 Agent",
        receiverNodeId: task.sourceNodeId || session?.sourceNodeId || session?.initiatorId || "协调者",
        startTime: timeValue(task.startTime) || (itemTimes.length ? Math.min(...itemTimes) : 0),
        endTime: timeValue(task.endTime),
        items
      };
    }

    function mergedTimeline(observations) {
      const session = selectedSession();
      const localMessages = state.localMessages[session?.sessionId] || [];
      const contextMessages = state.contextMessages[session?.sessionId] || [];
      const contextAnswers = new Map(contextMessages
        .filter((item) => item.kind === "answer" && item.taskId && item.text)
        .map((item) => [item.taskId, item.text]));
      const traces = new Map(observations.map((observation) => {
        const trace = taskTrace(observation, session, contextAnswers.get(observation?.taskId || observation?.task?.taskId || "") || "");
        return [trace.taskId, trace];
      }).filter(([taskId]) => taskId));
      const contextItems = contextMessages.map((item) => {
        const trace = item.taskId ? traces.get(item.taskId) : null;
        return {
          ...item,
          taskStatus: item.taskStatus || trace?.taskStatus || "",
          taskStage: item.taskStage || trace?.taskStage || "",
          executionTrace: trace?.items || []
        };
      });
      const fallbackItems = [];
      traces.forEach((trace) => {
        const hasFinalContext = contextAnswers.has(trace.taskId);
        if (hasFinalContext) return;
        const observation = observations.find((item) => (item?.taskId || item?.task?.taskId) === trace.taskId);
        const answer = taskAnswer(observation);
        fallbackItems.push({
          kind: answer ? "answer" : "pending",
          senderNodeId: trace.senderNodeId,
          receiverNodeId: trace.receiverNodeId,
          taskId: trace.taskId,
          taskStatus: trace.taskStatus,
          taskStage: trace.taskStage,
          text: answer || "Agent 正在执行，等待共享上下文中的最终回复。",
          time: trace.endTime || trace.startTime || Date.now(),
          executionTrace: trace.items
        });
      });
      return [...contextItems, ...fallbackItems, ...localMessages].sort((left, right) => {
        const timeOrder = Number(left.time || 0) - Number(right.time || 0);
        if (timeOrder) return timeOrder;
        if (left.taskId !== right.taskId) return String(left.taskId).localeCompare(String(right.taskId));
        return Number(left.sequenceNo || 0) - Number(right.sequenceNo || 0);
      });
    }

    function renderDayMarker(parent, value) {
      addText(parent, "div", formatDate(value), "day-marker");
    }

    function routeText(item) {
      const targets = item.targetNodeIds?.length
        ? item.targetNodeIds.map(nodeLabel).join(", ")
        : nodeLabel(item.receiverNodeId);
      return `${nodeLabel(item.senderNodeId)} @ ${targets}`;
    }

    function renderMessageHead(parent, item, badge) {
      const head = document.createElement("div");
      head.className = "message-head";
      addText(head, "span", nodeLabel(item.senderNodeId), "sender");
      const targets = item.targetNodeIds?.length
        ? item.targetNodeIds.map(nodeLabel).join(", ")
        : nodeLabel(item.receiverNodeId);
      addText(head, "span", `@ ${targets}`, "route");
      if (badge) addText(head, "span", badge, "message-badge");
      if (item.taskId) {
        const taskRef = addText(head, "span", shortId(item.taskId, 12), "task-reference");
        taskRef.title = item.taskId || "";
      }
      addText(head, "time", formatTime(item.time), "message-time");
      parent.appendChild(head);
    }

    function renderTextMessage(parent, item) {
      const article = document.createElement("article");
      article.className = `message ${item.kind === "answer" ? "final-message" : item.kind === "pending" ? "pending-message" : item.kind === "failure" ? "failure-message" : ""}`;
      addText(article, "div", avatarLabel(item.senderNodeId), "avatar");
      const content = document.createElement("div");
      content.className = "message-content";
      renderMessageHead(content, item, item.kind === "answer" ? "最终回复" : item.kind === "pending" ? "执行中" : item.kind === "system" ? "执行引导" : item.userMessage ? "用户消息" : "");
      if (item.kind === "answer") addMarkdown(content, item.text, "message-text");
      else addText(content, "p", item.text, "message-text");
      renderExecutionTrace(content, item);
      article.appendChild(content);
      parent.appendChild(article);
    }

    function createToolPanel(item, panelKey = expandedPanelKey("tool", item)) {
      const details = document.createElement("details");
      details.className = "tool-panel";
      const summary = document.createElement("summary");
      addText(summary, "span", ">_", "terminal-icon");
      const label = addText(summary, "span", item.label || item.name, "tool-label");
      label.title = item.label || item.name;
      const stateText = `${item.status || "UNKNOWN"}${item.durationMs !== null && item.durationMs !== undefined ? ` · ${formatDuration(item.durationMs)}` : ""}`;
      addText(summary, "span", stateText, `tool-state ${String(item.status || "").toLowerCase()}`);
      addText(summary, "span", "›", "chevron");
      details.appendChild(summary);
      const body = document.createElement("div");
      body.className = "tool-body";
      const input = document.createElement("div");
      input.className = "tool-section";
      addText(input, "div", `${item.name} 输入`, "tool-section-label");
      addText(input, "pre", json(sanitizeTraceValue(item.input)));
      body.appendChild(input);
      if (item.output) {
        const output = document.createElement("div");
        output.className = "tool-section";
        addText(output, "div", `执行结果 · ${item.status || "UNKNOWN"}`, "tool-section-label");
        addText(output, "pre", sanitizeTraceValue(item.output));
        body.appendChild(output);
      }
      details.appendChild(body);
      bindExpandedPanel(details, panelKey);
      return details;
    }

    function renderToolMessage(parent, item) {
      const article = document.createElement("article");
      article.className = "message tool-message";
      addText(article, "div", ">_", "avatar");
      const content = document.createElement("div");
      content.className = "message-content";
      renderMessageHead(content, item, "工具");
      const details = createToolPanel(item, expandedPanelKey("tool-message", item));
      content.appendChild(details);
      article.appendChild(content);
      parent.appendChild(article);
    }

    function renderExecutionTrace(parent, item) {
      const trace = Array.isArray(item.executionTrace) ? item.executionTrace : [];
      if (!trace.length) return;
      const tools = trace.filter((entry) => entry.kind === "tool");
      const steps = new Set(trace.map((entry) => entry.stepNo).filter((value) => Number.isFinite(value) && value > 0));
      const times = trace.map((entry) => Number(entry.time || 0)).filter((value) => value > 0);
      const duration = times.length > 1 ? Math.max(...times) - Math.min(...times) : null;
      const details = document.createElement("details");
      details.className = "execution-panel";
      const executionPanelKey = expandedPanelKey("execution", item);
      const summary = document.createElement("summary");
      addText(summary, "span", ">_", "terminal-icon");
      addText(summary, "span", `执行过程 · ${steps.size || 1} 个步骤 · ${tools.length} 次工具调用${duration !== null ? ` · ${formatDuration(duration)}` : ""}`, "execution-summary");
      addText(summary, "span", item.taskStatus || "", `tool-state ${String(item.taskStatus || "").toLowerCase()}`);
      addText(summary, "span", "›", "chevron");
      details.appendChild(summary);
      const body = document.createElement("div");
      body.className = "execution-body";
      trace.forEach((entry) => {
        if (entry.kind === "tool") {
          const toolIdentity = entry.key || entry.sequenceNo || entry.name || "tool";
          body.appendChild(createToolPanel(entry, `${executionPanelKey}|tool|${toolIdentity}`));
          return;
        }
        const row = document.createElement("div");
        row.className = "trace-entry";
        addText(row, "span", entry.kind === "analysis" ? "Agent 分析" : "执行事件", "trace-kind");
        addText(row, "span", entry.text || "无可见摘要", "trace-text");
        addText(row, "time", formatTime(entry.time), "trace-time");
        body.appendChild(row);
      });
      details.appendChild(body);
      bindExpandedPanel(details, executionPanelKey);
      parent.appendChild(details);
    }

    function renderTaskDivider(parent, item) {
      const divider = document.createElement("div");
      divider.className = "task-divider";
      addText(divider, "span", `${routeText(item)} · ${shortId(item.taskId, 12)}`);
      addText(divider, "span", item.taskStatus || "UNKNOWN", `task-state ${String(item.taskStatus || "").toLowerCase()}`);
      parent.appendChild(divider);
    }

    function renderConversation(observations, failures = []) {
      const root = $("conversation");
      root.replaceChildren();
      const items = mergedTimeline(observations);
      if (!items.length && !failures.length) {
        addText(root, "div", "当前模式下没有可见的 Agent 会话记录", "empty-state");
        return;
      }
      let currentDate = "";
      let currentTaskId = "";
      items.forEach((item) => {
        const date = formatDate(item.time);
        if (date !== currentDate) {
          renderDayMarker(root, item.time);
          currentDate = date;
          currentTaskId = "";
        }
        if (!item.skipDivider && item.taskId !== currentTaskId) {
          renderTaskDivider(root, item);
          currentTaskId = item.taskId;
        }
        if (item.kind === "tool") renderToolMessage(root, item);
        else if (item.kind === "empty-task") {
          renderTextMessage(root, { ...item, kind: "system", text: item.taskStatus === "RUNNING" ? "Agent 正在准备执行过程..." : "该任务没有保存可见的 Agent 过程。" });
        } else renderTextMessage(root, item);
      });
      failures.forEach((failure) => {
        renderTextMessage(root, {
          kind: "failure",
          senderNodeId: failure.nodeId,
          receiverNodeId: "协调者",
          taskId: "读取失败",
          time: Date.now(),
          text: failure.message
        });
      });
    }

    function renderLoading() {
      $("conversation").innerHTML = '<div class="loading-state"><div><div class="loading-dots"><span></span><span></span><span></span></div><div>正在读取 Agent 执行轨迹</div></div></div>';
    }

    function renderError(message) {
      const root = $("conversation");
      root.replaceChildren();
      const wrapper = document.createElement("div");
      wrapper.className = "error-state";
      const content = document.createElement("div");
      addText(content, "strong", "读取失败");
      addText(content, "div", message || "无法连接 CC center");
      wrapper.appendChild(content);
      root.appendChild(wrapper);
    }

    function captureConversationScroll() {
      const viewport = $("conversationScroll");
      if (!viewport) return null;
      const distanceFromBottom = viewport.scrollHeight - viewport.scrollTop - viewport.clientHeight;
      return {
        scrollTop: viewport.scrollTop,
        followBottom: distanceFromBottom <= 48
      };
    }

    function restoreConversationScroll(scrollState) {
      if (!scrollState) return;
      const viewport = $("conversationScroll");
      if (!viewport) return;
      const maxScrollTop = Math.max(0, viewport.scrollHeight - viewport.clientHeight);
      viewport.scrollTop = scrollState.followBottom
        ? maxScrollTop
        : Math.min(scrollState.scrollTop, maxScrollTop);
    }

    async function loadObservations({ preserveScroll = true } = {}) {
      const session = selectedSession();
      if (!session) return;
      const scrollState = preserveScroll ? captureConversationScroll() : null;
      const nodeIds = state.mode === "NODE" ? [state.selectedNodeId].filter(Boolean) : [...(session.nodeIds || [])];
      if (!nodeIds.length) {
        state.currentObservations = [];
        state.currentFailures = [];
        renderConversation([]);
        restoreConversationScroll(scrollState);
        return;
      }
      const serial = ++state.requestSerial;
      if (!scrollState) renderLoading();
      let synchronizationFailure = null;
      try {
        await uiApi(`/ui/sessions/${encodeURIComponent(state.selectedSessionId)}/sync`, { method: "POST", body: "{}" });
      } catch (error) {
        synchronizationFailure = { nodeId: "sync", message: `任务状态同步失败：${error.message}` };
      }
      const results = await Promise.allSettled(nodeIds.map(async (nodeId) => {
        return await uiApi(`/ui/session-observations?sessionId=${encodeURIComponent(state.selectedSessionId)}&nodeId=${encodeURIComponent(nodeId)}&eventLimit=200&tailLines=200&maxBytes=131072`);
      }));
      let context = { events: [] };
      try {
        context = await uiApi(`/session/${encodeURIComponent(state.selectedSessionId)}/context/delta?afterCursor=0&limit=500`);
      } catch (error) {
        state.currentFailures = [{ nodeId: "context", message: `共享上下文读取失败：${error.message}` }];
      }
      if (serial !== state.requestSerial) return;
      const observations = [];
      const failures = synchronizationFailure ? [synchronizationFailure] : [];
      results.forEach((result, index) => {
        if (result.status === "fulfilled") observations.push(...(result.value?.observations || []));
        else failures.push({ nodeId: nodeIds[index], message: result.reason?.message || "节点读取失败" });
      });
      const selectedContextNodeId = state.mode === "NODE" ? state.selectedNodeId : "";
      state.contextMessages[state.selectedSessionId] = (context.events || []).filter((event) => {
        if (!selectedContextNodeId) return true;
        const targetNodeIds = String(event.targetNodeId || "")
          .split(",")
          .map((item) => item.trim())
          .filter(Boolean);
        return targetNodeIds.length === 0 || targetNodeIds.includes(selectedContextNodeId);
      }).map((event) => ({
        kind: event.role === "user" ? "message" : "answer",
        userMessage: event.role === "user",
        skipDivider: true,
        senderNodeId: event.senderId || event.senderType || "协调者",
        receiverNodeId: event.targetNodeId || "会话参与节点",
        targetNodeIds: String(event.targetNodeId || "").split(",").map((item) => item.trim()).filter(Boolean),
        text: event.content || "",
        time: timeValue(event.createdTime),
        sequenceNo: Number(event.cursor || 0),
        taskId: event.taskId || ""
      })).filter((item) => item.text);
      state.lastUpdated = Date.now();
      state.currentObservations = observations;
      state.currentFailures = [...(state.currentFailures || []).filter((item) => item.nodeId === "context"), ...failures];
      renderHeader();
      renderConversation(observations, failures);
      restoreConversationScroll(scrollState);
    }

    async function refresh({ preserveSelection = true } = {}) {
      if (refreshInFlight) return;
      refreshInFlight = true;
      $("sidebarFoot").textContent = "正在读取 CC center...";
      try {
        const [sessions, nodes] = await Promise.all([
          uiApi("/ui/sessions?sessionLimit=200"),
          uiApi("/relay/nodes")
        ]);
        state.sessions = (Array.isArray(sessions) ? sessions : []).map(normalizeSession);
        state.nodes = Array.isArray(nodes) ? nodes : [];
        $("sidebarFoot").textContent = `已连接 CC center · ${state.nodes.length} 个节点`;
        if (!preserveSelection || !state.sessions.some((session) => session.sessionId === state.selectedSessionId)) {
          state.selectedSessionId = state.sessions[0]?.sessionId || "";
          state.selectedNodeId = "";
        }
        renderSessions();
        renderNodes();
        renderHeader();
        renderComposer();
        if (state.selectedSessionId) await loadObservations({ preserveScroll: preserveSelection });
      } finally {
        refreshInFlight = false;
      }
    }

    async function createSession() {
      try {
        const created = await uiApi("/ui/sessions", {
          method: "POST",
          body: JSON.stringify({ initiatorType: "USER", initiatorId: "ccrelay-observer", sourceNodeId: "cc-center-ui" })
        });
        await refresh({ preserveSelection: false });
        state.selectedSessionId = created.sessionId;
        state.selectedNodeId = "";
        state.mentions = [];
        setMentionMenuOpen(false);
        renderSessions();
        renderNodes();
        renderHeader();
        renderComposer();
        renderConversation([]);
        setComposerFeedback("真实会话已创建，请 @ 一个或多个节点", "success");
        $("messageInput").focus();
      } catch (error) {
        setComposerFeedback(`新建会话失败：${error.message}`, "error");
      }
    }

    async function selectSession(sessionId) {
      if (!sessionId || sessionId === state.selectedSessionId) {
        document.body.classList.remove("sidebar-open");
        return;
      }
      state.selectedSessionId = sessionId;
      state.selectedNodeId = "";
      state.mentions = [];
      setMentionMenuOpen(false);
      setComposerFeedback("");
      state.lastUpdated = null;
      renderSessions();
      renderNodes();
      renderHeader();
      renderComposer();
      document.body.classList.remove("sidebar-open");
      await loadObservations({ preserveScroll: false });
    }

    async function selectMode(mode) {
      if (mode === state.mode) return;
      state.mode = mode;
      renderMode();
      renderHeader();
      await loadObservations({ preserveScroll: false });
    }

    $("sessionList").addEventListener("click", (event) => {
      const button = event.target.closest("button[data-session-id]");
      if (button) selectSession(button.dataset.sessionId);
    });
    $("sessionSearch").addEventListener("input", (event) => {
      state.search = event.target.value || "";
      renderSessions();
    });
    $("nodeSelect").addEventListener("change", async (event) => {
      state.selectedNodeId = event.target.value;
      renderHeader();
      await loadObservations({ preserveScroll: false });
    });
    $("mentionButton").addEventListener("click", () => {
      const menu = $("mentionMenu");
      setMentionMenuOpen(menu.hidden);
    });
    $("mentionMenu").addEventListener("click", (event) => {
      const option = event.target.closest("button[data-mention-node]");
      if (option) toggleMention(option.dataset.mentionNode);
    });
    $("mentionChips").addEventListener("click", (event) => {
      const remove = event.target.closest("button[data-remove-mention]");
      if (remove) removeMention(remove.dataset.removeMention);
    });
    $("messageInput").addEventListener("input", () => {
      resizeMessageInput();
      const filter = mentionInputFilter();
      if (filter !== null) setMentionMenuOpen(true, filter);
      setComposerFeedback("");
    });
    $("messageInput").addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
      }
      if (event.key === "Escape") setMentionMenuOpen(false);
    });
    $("sendMessageButton").addEventListener("click", sendMessage);
    $("newSessionButton").addEventListener("click", createSession);
    document.addEventListener("click", (event) => {
      if (!event.target.closest(".composer-inner")) setMentionMenuOpen(false);
    });
    $("nodeModeButton").addEventListener("click", () => selectMode("NODE"));
    $("groupModeButton").addEventListener("click", () => selectMode("GROUP"));
    $("refreshButton").addEventListener("click", () => refresh({ preserveSelection: true }));
    $("sidebarToggle").addEventListener("click", () => document.body.classList.add("sidebar-open"));
    $("closeSidebar").addEventListener("click", () => document.body.classList.remove("sidebar-open"));
    $("sidebarOverlay").addEventListener("click", () => document.body.classList.remove("sidebar-open"));
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") document.body.classList.remove("sidebar-open");
    });

    renderMode();
    refresh({ preserveSelection: false }).catch((error) => {
      $("sidebarFoot").textContent = `CC center 不可用：${error.message}`;
      renderError(error.message);
    });
    window.setInterval(() => {
      if (!document.hidden) {
        refresh({ preserveSelection: true }).catch((error) => {
          $("sidebarFoot").textContent = `CC center 不可用：${error.message}`;
        });
      }
    }, 2000);
  </script>
</body>
</html>
