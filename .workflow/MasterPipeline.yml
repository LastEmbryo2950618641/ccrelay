version: '1.0'
name: ccrelay-release-build
displayName: 'CC Relay Release Build'
stages:
  - stage:
    name: build_release
    displayName: 'Build Release'
    steps:
      - step: build@gradle
        name: build_release_gradle
        displayName: 'Build CC Relay release packages'
        jdkVersion: 21
        gradleVersion: 8.5
        commands:
          - chmod +x ./scripts/gitee_go_build.sh ./build.sh
          - ./scripts/gitee_go_build.sh
        artifacts:
          - name: RELEASE_ARTIFACT
            path:
              - ./dist/release
      - step: publish@general_artifacts
        name: publish_release_artifacts
        displayName: 'Upload release artifacts'
        dependArtifact: RELEASE_ARTIFACT
        artifactRepository: ccrelay-release
        artifactName: ccrelay-release
        dependsOn: build_release_gradle
