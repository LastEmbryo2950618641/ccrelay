name: Build Skill ZIP

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: build-skill-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ccrelay package
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.5"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Cache bundled runtimes
        uses: actions/cache@v4
        with:
          path: |
            .cache/runtime-bundle
            .cache/claude-code-linux-x64
          key: ccrelay-runtime-v1-jre21-python3.13.15-claude2.1.220

      - name: Run Java tests
        run: gradle test

      - name: Run CLI tests
        run: python scripts/test_ccrelay_cli.py

      - name: Build application JAR
        run: gradle bootJar

      - name: Build self-contained runtime bundle
        shell: pwsh
        run: |
          $bootJar = Get-ChildItem -Path build/libs -Filter '*.jar' -File |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $bootJar) {
            throw 'Boot JAR was not generated.'
          }
          try {
            ./scripts/build_runtime_bundle.ps1 `
              -BootJarPath $bootJar.FullName `
              -BundleRoot ./build/runtime-bundle/ccrelay
          } catch {
            $message = ($_ | Out-String).Trim()
            $annotation = $message.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Host "::error title=Runtime bundle failed::$annotation"
            throw
          }

      - name: Assemble runnable Skill
        run: bash build.sh

      - name: Create ZIP archive
        id: package
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n "s/^version = '\([^']*\)'.*/\1/p" build.gradle | head -n 1)
          test -n "$version"
          archive="ccrelay-${version}-${GITHUB_SHA::7}.zip"
          mkdir -p dist/release
          (
            cd dist/skill
            zip -q -r "../release/$archive" ccrelay
          )
          sha256sum "dist/release/$archive" > "dist/release/$archive.sha256"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "path=dist/release/$archive" >> "$GITHUB_OUTPUT"
          echo "checksum=dist/release/$archive.sha256" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.archive }}
          path: |
            ${{ steps.package.outputs.path }}
            ${{ steps.package.outputs.checksum }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Publish tagged release asset
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --generate-notes --title "$GITHUB_REF_NAME"
          fi
          gh release upload "$GITHUB_REF_NAME" \
            "${{ steps.package.outputs.path }}" \
            "${{ steps.package.outputs.checksum }}" \
            --clobber
