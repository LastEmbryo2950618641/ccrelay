name: Build Skill ZIP

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: build-skill-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ccrelay package
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.5"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Cache bundled runtimes
        uses: actions/cache@v4
        with:
          path: |
            .cache/runtime-bundle
            .cache/claude-code-linux-x64
          key: ccrelay-runtime-v1-jre21-python3.13.15-claude2.1.220

      - name: Run Java tests
        run: gradle test

      - name: Run CLI tests
        run: |
          python scripts/test_ccrelay_cli.py
          python scripts/test_release_packages.py

      - name: Build application JAR
        run: gradle bootJar

      - name: Build self-contained runtime bundle
        shell: pwsh
        run: |
          $bootJar = Get-ChildItem -Path build/libs -Filter '*.jar' -File |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $bootJar) {
            throw 'Boot JAR was not generated.'
          }
          try {
            ./scripts/build_runtime_bundle.ps1 `
              -BootJarPath $bootJar.FullName `
              -BundleRoot ./build/runtime-bundle/ccrelay
          } catch {
            $message = ($_ | Out-String).Trim()
            $annotation = $message.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Host "::error title=Runtime bundle failed::$annotation"
            throw
          }

      - name: Assemble runnable Skill
        run: bash build.sh

      - name: Collect unified release packages
        id: package
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n "s/^version = '\([^']*\)'.*/\1/p" build.gradle | head -n 1)
          test -n "$version"
          test -f dist/release/ccrelay-full.zip
          test -f dist/release/ccrelay-bootstrap.zip
          echo "artifact=ccrelay-${version}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.artifact }}
          path: |
            dist/release/ccrelay-full.zip
            dist/release/ccrelay-full.zip.sha256
            dist/release/ccrelay-bootstrap.zip
            dist/release/ccrelay-bootstrap.zip.sha256
            dist/release/release-manifest.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Publish version release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n "s/^version = '\([^']*\)'.*/\1/p" build.gradle | head -n 1)
          release_tag="v$version"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$release_tag" >/dev/null 2>&1; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$release_tag" \
              -f sha="$GITHUB_SHA" \
              -F force=true >/dev/null
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$release_tag" \
              -f sha="$GITHUB_SHA" >/dev/null
          fi
          if ! gh release view "$release_tag" >/dev/null 2>&1; then
            gh release create "$release_tag" --generate-notes --title "$release_tag"
          fi
          gh release upload "$release_tag" \
            dist/release/ccrelay-full.zip \
            dist/release/ccrelay-full.zip.sha256 \
            dist/release/ccrelay-bootstrap.zip \
            dist/release/ccrelay-bootstrap.zip.sha256 \
            dist/release/release-manifest.json \
            --clobber
          gh release edit "$release_tag" --latest

      - name: Mirror release assets to Gitee
        if: github.event_name == 'workflow_dispatch'
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          version=$(sed -n "s/^version = '\([^']*\)'.*/\1/p" build.gradle | head -n 1)
          python scripts/publish_gitee_release.py \
            --owner nekoneko-acg \
            --repo ccrelay \
            --release-dir dist/release \
            --target-commitish "$GITHUB_REF_NAME" \
            --tag "v$version" \
            --name "v$version"
